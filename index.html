    <style>
      /* Ink bleed splash styles — scoped to this page only */
      .ink-splash {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .ink-name-stack {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        padding: 0 48px;
      }

      .ink-name {
        font-family: 'SF Pro', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: clamp(5rem, 11vw, 10rem);
        font-weight: 900;
        line-height: 1.05;
        margin: 0;
        padding: 0;
        text-align: left;
        letter-spacing: -0.02em;
        text-transform: lowercase;
      }

      .ink-name-1 {
        color: #111;
        /* Crisp, solid black — no filter */
      }

      .ink-name-2 {
        color: #8a7e74;
        filter: url(#ink-bleed-light);
      }

      .ink-name-3 {
        color: #5c1a2a;
        filter: url(#ink-bleed-heavy);
      }

      /* Reduced motion fallback */
      @media (prefers-reduced-motion: reduce) {
        .ink-name-2,
        .ink-name-3 {
          filter: none;
          opacity: 0.7;
        }
      }

      /* Mobile adjustments */
      @media (max-width: 900px) {
        .ink-splash {
          min-height: auto;
          padding: 48px 0;
        }
        .ink-name-stack {
          padding: 0 24px;
        }
        .ink-name {
          font-size: clamp(2.5rem, 14vw, 5rem);
        }
      }
    </style>
</head>

<body>
  <!-- Hidden SVG filter definitions for ink bleed effects -->
  <svg style="position:absolute;width:0;height:0;" aria-hidden="true">
    <defs>
      <!-- Light ink bleed: subtle edge feathering -->
      <filter id="ink-bleed-light" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        <feGaussianBlur in="displaced" stdDeviation="0.6" />
      </filter>
      <!-- Heavy ink bleed: maximum dissolution -->
      <filter id="ink-bleed-heavy" x="-15%" y="-15%" width="130%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="5" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        <feGaussianBlur in="displaced" stdDeviation="1.4" />
      </filter>
    </defs>
  </svg>
